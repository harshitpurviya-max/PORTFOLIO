<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0c0e12"/>

  <!-- Neon lime border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#CCFF00" stroke-width="2.5"/>

  <!-- Subtle violet inner glow accent (top-left arc) -->
  <circle cx="0" cy="0" r="32" fill="url(#glow)" opacity="0.18"/>

  <!-- Letter H -->
  <text
    x="9"
    y="46"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="34"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-1"
  >H</text>

  <!-- Divider slash in neon lime -->
  <line x1="36" y1="14" x2="28" y2="50" stroke="#CCFF00" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Letter P -->
  <text
    x="33"
    y="46"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="34"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-1"
  >P</text>

  <defs>
    <radialGradient id="glow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#0c0e12" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

